databases:
  - name: thebyte-db
    plan: free
    databaseName: thebyte
    user: thebyte

services:
  - type: web
    plan: free
    name: thebyte
    runtime: python
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn thebyte_project.wsgi:application --preload"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thebyte-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: PYTHON_VERSION
        value: 3.12.8
